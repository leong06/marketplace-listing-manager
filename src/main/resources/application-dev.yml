app:
  photos:
    root: ${user.home}/Pictures/ItemPhotos
spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace-postgres
    username: marketplaceUser
    password: password
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true