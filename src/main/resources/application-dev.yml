app:
  photos:
    root: ${user.home}/Pictures/ItemPhotos
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:${user.home}/MarketplaceListing/.env[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 200MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true